<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>SafeNexus Gridline</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --line: #d9e1ef;
        --line-strong: #b9c8df;
        --text: #13203a;
        --muted: #66758f;
        --blue: #1f6fff;
        --blue-soft: #edf4ff;
        --green: #0f8a5f;
        --shadow: 0 18px 44px rgba(18, 38, 72, 0.1);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(31, 111, 255, 0.12), transparent 32rem),
          linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .app {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        height: 100vh;
        padding: 18px;
        gap: 12px;
      }

      .topbar,
      .formula {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .title {
        display: grid;
        gap: 2px;
      }

      .title strong {
        font-size: 1.05rem;
        letter-spacing: 0;
      }

      .title span,
      .status {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 800;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      button:hover {
        border-color: var(--blue);
        box-shadow: 0 8px 18px rgba(31, 111, 255, 0.12);
      }

      .formula {
        justify-content: stretch;
        box-shadow: 0 10px 28px rgba(18, 38, 72, 0.07);
      }

      .cell-ref {
        width: 82px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--blue-soft);
        color: #174b9f;
        font-weight: 900;
      }

      .formula input {
        flex: 1;
        min-width: 0;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        outline: none;
      }

      .formula input:focus {
        border-color: rgba(31, 111, 255, 0.65);
        box-shadow: 0 0 0 3px rgba(31, 111, 255, 0.12);
      }

      .grid-shell {
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .grid-scroll {
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      .grid-error {
        margin: 18px;
        padding: 14px;
        border: 1px solid #ffd6a8;
        border-radius: 12px;
        background: #fff8ef;
        color: #87540c;
        font-size: 0.88rem;
        font-weight: 800;
      }

      table {
        border-collapse: separate;
        border-spacing: 0;
        min-width: 1600px;
        width: max-content;
        table-layout: fixed;
        font-size: 0.86rem;
      }

      th,
      td {
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 0;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 3;
        height: 34px;
        background: #eef3fb;
        color: #3a4861;
        font-weight: 900;
        text-align: center;
      }

      .corner {
        left: 0;
        z-index: 5;
        width: 52px;
        min-width: 52px;
      }

      tbody th {
        position: sticky;
        left: 0;
        z-index: 2;
        width: 52px;
        min-width: 52px;
        background: #f5f8fd;
        color: #63728d;
        font-weight: 900;
        text-align: center;
      }

      td {
        width: 150px;
        min-width: 150px;
        height: 34px;
        background: #fff;
      }

      td.is-selected {
        box-shadow: inset 0 0 0 2px var(--blue);
        background: #fbfdff;
      }

      input.cell {
        width: 100%;
        height: 34px;
        padding: 0 8px;
        border: 0;
        border-radius: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      input.cell:focus {
        background: #fbfdff;
      }

      .status.is-saving {
        color: #b7791f;
      }

      .status.is-saved {
        color: var(--green);
      }

      @media (max-width: 760px) {
        .app {
          padding: 10px;
        }

        .topbar,
        .formula {
          align-items: stretch;
          flex-direction: column;
        }

        .actions {
          width: 100%;
        }

        button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">
          <strong>SafeNexus Gridline</strong>
          <span>Samo browser tablica, bez aplikacije i bez backend poziva kod unosa.</span>
        </div>
        <div class="actions">
          <span id="status" class="status is-saved">Spremno</span>
          <button type="button" id="add-row">+ 20 redova</button>
          <button type="button" id="clear">Ocisti</button>
          <button type="button" id="download" class="primary">Preuzmi JSON</button>
        </div>
      </header>

      <section class="formula" aria-label="Formula bar">
        <div id="cell-ref" class="cell-ref">A1</div>
        <input id="formula-input" type="text" autocomplete="off" spellcheck="false" placeholder="Vrijednost aktivne celije" />
      </section>

      <section class="grid-shell">
        <div id="grid-scroll" class="grid-scroll">
          <table id="grid" aria-label="Gridline tablica"></table>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const STORAGE_KEY = "safenexus-gridline-standalone-v1";
        const INITIAL_ROWS = 80;
        const INITIAL_COLUMNS = 14;
        const grid = document.querySelector("#grid");
        const status = document.querySelector("#status");
        const formulaInput = document.querySelector("#formula-input");
        const cellRef = document.querySelector("#cell-ref");
        const addRowButton = document.querySelector("#add-row");
        const clearButton = document.querySelector("#clear");
        const downloadButton = document.querySelector("#download");
        let rowCount = INITIAL_ROWS;
        let columnCount = INITIAL_COLUMNS;
        let data = Object.create(null);
        let active = { row: 0, column: 0 };
        let saveTimer = 0;

        function clearNode(node) {
          while (node.firstChild) {
            node.removeChild(node.firstChild);
          }
        }

        function getClosestCellInput(target) {
          if (!target || typeof target.closest !== "function") {
            return null;
          }
          return target.closest("input.cell");
        }

        function showGridError(error) {
          clearNode(grid);
          const tbody = document.createElement("tbody");
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 2;
          const box = document.createElement("div");
          box.className = "grid-error";
          box.textContent = `Grid se nije mogao nacrtati na ovom browseru: ${error && error.message ? error.message : "nepoznata greska"}`;
          td.appendChild(box);
          tr.appendChild(td);
          tbody.appendChild(tr);
          grid.appendChild(tbody);
          setStatus("Greska prikaza", "is-saving");
        }

        function columnLabel(index) {
          let label = "";
          let current = index + 1;
          while (current > 0) {
            const mod = (current - 1) % 26;
            label = String.fromCharCode(65 + mod) + label;
            current = Math.floor((current - mod) / 26);
          }
          return label;
        }

        function key(row, column) {
          return `${row}:${column}`;
        }

        function getValue(row, column) {
          return data[key(row, column)] || "";
        }

        function setValue(row, column, value) {
          const id = key(row, column);
          const next = String(value || "");
          if (next) {
            data[id] = next;
          } else {
            delete data[id];
          }
        }

        function setStatus(text, className) {
          status.textContent = text;
          status.className = `status ${className || ""}`.trim();
        }

        function scheduleSave() {
          setStatus("Lokalna izmjena", "is-saving");
          if (saveTimer) {
            window.clearTimeout(saveTimer);
          }
          saveTimer = window.setTimeout(() => {
            saveTimer = 0;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ rowCount, columnCount, data }));
            setStatus("Spremljeno lokalno", "is-saved");
          }, 450);
        }

        function load() {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            if (saved && typeof saved === "object") {
              rowCount = Math.max(INITIAL_ROWS, Number(saved.rowCount) || INITIAL_ROWS);
              columnCount = Math.max(INITIAL_COLUMNS, Number(saved.columnCount) || INITIAL_COLUMNS);
              data = saved.data && typeof saved.data === "object" ? Object.assign(Object.create(null), saved.data) : Object.create(null);
            }
          } catch {
            data = Object.create(null);
          }
        }

        function render() {
          const fragment = document.createDocumentFragment();
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          const corner = document.createElement("th");
          corner.className = "corner";
          headRow.appendChild(corner);
          for (let column = 0; column < columnCount; column += 1) {
            const th = document.createElement("th");
            th.textContent = columnLabel(column);
            headRow.appendChild(th);
          }
          thead.appendChild(headRow);
          fragment.appendChild(thead);

          const tbody = document.createElement("tbody");
          for (let row = 0; row < rowCount; row += 1) {
            const tr = document.createElement("tr");
            const rowHead = document.createElement("th");
            rowHead.textContent = String(row + 1);
            tr.appendChild(rowHead);
            for (let column = 0; column < columnCount; column += 1) {
              const td = document.createElement("td");
              td.dataset.row = String(row);
              td.dataset.column = String(column);
              const input = document.createElement("input");
              input.className = "cell";
              input.value = getValue(row, column);
              input.autocomplete = "off";
              input.spellcheck = false;
              input.dataset.row = String(row);
              input.dataset.column = String(column);
              td.appendChild(input);
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          fragment.appendChild(tbody);
          clearNode(grid);
          grid.appendChild(fragment);
          selectCell(active.row, active.column, { focus: false });
        }

        function getInput(row, column) {
          return grid.querySelector(`input[data-row="${row}"][data-column="${column}"]`);
        }

        function selectCell(row, column, { focus = true } = {}) {
          active = {
            row: Math.max(0, Math.min(rowCount - 1, row)),
            column: Math.max(0, Math.min(columnCount - 1, column)),
          };
          grid.querySelectorAll("td.is-selected").forEach((cell) => cell.classList.remove("is-selected"));
          const input = getInput(active.row, active.column);
          const td = input ? input.parentElement : null;
          if (td) {
            td.classList.add("is-selected");
          }
          cellRef.textContent = `${columnLabel(active.column)}${active.row + 1}`;
          formulaInput.value = getValue(active.row, active.column);
          if (focus && input) {
            input.focus();
            input.select();
          }
        }

        function handlePaste(event) {
          const text = event.clipboardData ? event.clipboardData.getData("text/plain") : "";
          if (!text.includes("\t") && !text.includes("\n")) {
            return;
          }
          event.preventDefault();
          const rows = text.replace(/\r/g, "").split("\n").filter((row) => row.length > 0);
          rows.forEach((line, rowOffset) => {
            line.split("\t").forEach((value, columnOffset) => {
              const row = active.row + rowOffset;
              const column = active.column + columnOffset;
              if (row >= rowCount || column >= columnCount) {
                return;
              }
              setValue(row, column, value);
              const input = getInput(row, column);
              if (input) {
                input.value = value;
              }
            });
          });
          formulaInput.value = getValue(active.row, active.column);
          scheduleSave();
        }

        grid.addEventListener("focusin", (event) => {
          const input = getClosestCellInput(event.target);
          if (!input) {
            return;
          }
          selectCell(Number(input.dataset.row), Number(input.dataset.column), { focus: false });
        });

        grid.addEventListener("input", (event) => {
          const input = getClosestCellInput(event.target);
          if (!input) {
            return;
          }
          const row = Number(input.dataset.row);
          const column = Number(input.dataset.column);
          setValue(row, column, input.value);
          if (row === active.row && column === active.column) {
            formulaInput.value = input.value;
          }
          scheduleSave();
        });

        grid.addEventListener("keydown", (event) => {
          const input = getClosestCellInput(event.target);
          if (!input) {
            return;
          }
          const row = Number(input.dataset.row);
          const column = Number(input.dataset.column);
          const move = (nextRow, nextColumn) => {
            event.preventDefault();
            selectCell(nextRow, nextColumn);
          };
          if (event.key === "Enter") {
            move(row + (event.shiftKey ? -1 : 1), column);
          } else if (event.key === "Tab") {
            move(row, column + (event.shiftKey ? -1 : 1));
          } else if (event.key === "ArrowDown" && input.selectionStart === input.value.length) {
            move(row + 1, column);
          } else if (event.key === "ArrowUp" && input.selectionStart === 0) {
            move(row - 1, column);
          }
        });

        grid.addEventListener("paste", handlePaste);

        formulaInput.addEventListener("input", () => {
          setValue(active.row, active.column, formulaInput.value);
          const input = getInput(active.row, active.column);
          if (input) {
            input.value = formulaInput.value;
          }
          scheduleSave();
        });

        addRowButton.addEventListener("click", () => {
          rowCount += 20;
          render();
          scheduleSave();
        });

        clearButton.addEventListener("click", () => {
          if (!confirm("Ocistiti cijelu tablicu?")) {
            return;
          }
          data = Object.create(null);
          active = { row: 0, column: 0 };
          render();
          scheduleSave();
        });

        downloadButton.addEventListener("click", () => {
          const blob = new Blob([JSON.stringify({ rowCount, columnCount, data }, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "safenexus-gridline.json";
          link.click();
          URL.revokeObjectURL(url);
        });

        load();
        try {
          render();
        } catch (error) {
          showGridError(error);
        }
      })();
    </script>
  </body>
</html>
