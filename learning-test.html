<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="application-name" content="SafeNexus" />
  <meta name="apple-mobile-web-app-title" content="SafeNexus" />
  <meta name="theme-color" content="#1d74f5" />
  <title>SafeNexus - Pristup ispitu</title>
  <link rel="canonical" href="https://safe-nexus.org/learning-test.html" />
  <link rel="icon" type="image/png" sizes="352x352" href="/assets/safenexus-mark.png" />
  <link rel="apple-touch-icon" href="/assets/safenexus-mark.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body.learning-public-root {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(29, 116, 245, 0.14), transparent 34vw),
        linear-gradient(135deg, #f4f8ff 0%, #fbf7ff 52%, #f5fff9 100%);
      color: #172033;
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: grid;
      place-items: start center;
      padding: 24px 14px;
    }

    .learning-public-shell {
      width: min(1060px, 100%);
      background: #ffffff;
      border: 1px solid rgba(142, 173, 226, 0.48);
      border-radius: 24px;
      box-shadow: 0 24px 72px rgba(44, 69, 113, 0.16);
      padding: clamp(16px, 2vw, 24px);
      display: grid;
      gap: 16px;
    }

    .learning-public-title {
      margin: 0;
      font-size: clamp(1.45rem, 2.2vw, 2rem);
      font-weight: 800;
      letter-spacing: 0;
    }

    .learning-public-meta {
      margin: 0;
      color: #60708c;
      font-size: 0.92rem;
    }

    .learning-public-card {
      border: 1px solid rgba(142, 173, 226, 0.48);
      border-radius: 20px;
      padding: clamp(14px, 2vw, 20px);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      display: grid;
      gap: 14px;
    }

    .learning-public-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .learning-public-step {
      border: 1px solid rgba(142, 173, 226, 0.5);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
      color: #62708a;
      font-weight: 800;
      font-size: 0.88rem;
      text-align: left;
    }

    .learning-public-step.is-active {
      border-color: rgba(29, 116, 245, 0.6);
      background: #eaf3ff;
      color: #165fc8;
      box-shadow: inset 0 0 0 1px rgba(29, 116, 245, 0.1);
    }

    .learning-public-section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      flex-wrap: wrap;
    }

    .learning-public-section-head h2 {
      margin: 0;
      font-size: clamp(1.05rem, 1.5vw, 1.35rem);
      letter-spacing: 0;
    }

    .learning-public-kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      background: #eef6ff;
      color: #1d74f5;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .learning-public-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .learning-public-field {
      border: 1px solid rgba(142, 173, 226, 0.42);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
      display: grid;
      gap: 3px;
      min-height: 56px;
    }

    .learning-public-field span {
      color: #6f7c91;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .learning-public-field strong {
      color: #182235;
      font-size: 0.98rem;
      overflow-wrap: anywhere;
    }

    .learning-public-note {
      border: 1px solid rgba(142, 173, 226, 0.35);
      border-radius: 14px;
      padding: 12px;
      background: #ffffff;
      color: #3f4c63;
      line-height: 1.48;
      white-space: pre-wrap;
    }

    .learning-public-check {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      border: 1px solid rgba(37, 160, 115, 0.34);
      border-radius: 14px;
      padding: 12px;
      background: #f3fff9;
      font-weight: 700;
      color: #1e4c3e;
    }

    .learning-public-materials {
      display: grid;
      gap: 10px;
    }

    .learning-public-material {
      border: 1px solid rgba(142, 173, 226, 0.44);
      border-radius: 16px;
      padding: 12px;
      background: #fff;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .learning-public-material-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #eaf3ff;
      color: #1d74f5;
      font-weight: 900;
    }

    .learning-public-material strong,
    .learning-public-material span {
      display: block;
    }

    .learning-public-material a {
      color: #165fc8;
      font-weight: 800;
      text-decoration: none;
    }

    .learning-public-material-preview {
      grid-column: 1 / -1;
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(142, 173, 226, 0.36);
    }

    .learning-public-question {
      border: 1px solid rgba(142, 173, 226, 0.48);
      border-radius: 16px;
      padding: 14px;
      background: #ffffff;
      display: grid;
      gap: 12px;
    }

    .learning-public-question h3 {
      margin: 0;
      font-size: 1rem;
    }

    .learning-public-timer {
      position: sticky;
      top: 10px;
      z-index: 5;
      justify-self: end;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.24);
      background: rgba(239, 246, 255, 0.96);
      color: #1d4ed8;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
    }

    .learning-public-timer.is-warning {
      border-color: rgba(220, 38, 38, 0.26);
      background: rgba(254, 242, 242, 0.96);
      color: #b91c1c;
    }

    .learning-public-options {
      display: grid;
      gap: 8px;
    }

    .learning-public-option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      border: 1px solid rgba(142, 173, 226, 0.42);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fbfdff;
    }

    .learning-public-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .learning-public-actions.is-split {
      justify-content: space-between;
    }

    .learning-public-error {
      margin: 0;
      color: #af1740;
      font-weight: 700;
      min-height: 1.2em;
    }

    .learning-public-success {
      margin: 0;
      color: #1f6f56;
      font-weight: 700;
      min-height: 1.2em;
    }

    .learning-public-empty {
      border: 1px dashed rgba(142, 173, 226, 0.7);
      border-radius: 14px;
      padding: 16px;
      color: #60708c;
      background: #fff;
    }

    @media (max-width: 680px) {
      body.learning-public-root {
        padding: 10px;
      }

      .learning-public-shell {
        border-radius: 18px;
      }

      .learning-public-steps,
      .learning-public-grid {
        grid-template-columns: 1fr;
      }

      .learning-public-material {
        grid-template-columns: 38px 1fr;
      }

      .learning-public-material .primary-button,
      .learning-public-material .secondary-button {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body class="learning-public-root">
  <main class="learning-public-shell" id="learning-public-app">
    <h1 class="learning-public-title">Učitavam ispit…</h1>
    <p class="learning-public-meta">Provjeri link koji si dobio. Ako je token ispravan, test će se prikazati ovdje.</p>
    <p class="learning-public-error" id="learning-public-error"></p>
    <p class="learning-public-success" id="learning-public-success"></p>
    <section class="learning-public-card" id="learning-public-content" hidden></section>
  </main>
  <script type="module" src="/src/learning-test.js"></script>
</body>
</html>
